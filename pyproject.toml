[project]
name = "website-monitor"
version = "0.1.0"
description = "Check for changes in your websites"
readme = "README.md"
requires-python = ">=3.8,<3.9"
dependencies = [
    "beautifulsoup4==4.9.2",
    "coverage==5.3",
    "pandas>=2.0.3",
    "python-telegram-bot==12.5.1",
    "requests==2.32.4",
    "responses==0.12.0",
]

[project.scripts]
website-monitor = "website_monitor.main:main"

[build-system]
requires = ["uv_build>=0.9.10,<0.10.0"]
build-backend = "uv_build"
